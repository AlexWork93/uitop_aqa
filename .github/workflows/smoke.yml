name: Smoke

on:
  push:
    branches: '**'

jobs:
  smoke:
    name: Smoke — API + UI sanity
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run smoke tests
        run: npx playwright test --project=smoke --project=api

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
