name: E2E Regression

on:
  pull_request:
    branches: [master, main]
  schedule:
    # 08:00 Kyiv time — UTC+2 (winter) / UTC+3 (summer). Using 06:00 UTC as a year-round fit.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop — ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run E2E tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  mobile:
    name: Mobile — ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-iphone14
          - mobile-pixel7
          - mobile-galaxys9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run E2E tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
