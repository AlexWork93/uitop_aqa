name: E2E Regression

run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('E2E Regression, {0}, {1}', ' from ', github.head_ref, ' to ', github.base_ref)
    || format('Daily #{0}', github.run_number) }}

permissions:
  contents: write

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

jobs:
  desktop:
    name: Desktop — ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    env:
      HOME: /root
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run E2E tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 1

  mobile:
    name: Mobile — ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    env:
      HOME: /root
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-iphone14
          - mobile-pixel7
          - mobile-galaxys9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run E2E tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 1

  # ── Publish ──────────────────────────────────────────────────────────────────
  publish:
    name: Merge reports and publish to GitHub Pages
    needs: [desktop, mobile]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blobs
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          publish_branch: gh-pages
